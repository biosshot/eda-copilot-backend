name: Backend portability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-15]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: rustup default stable
      - name: Install macOS Vulkan build SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sdk_version=1.4.335.1
          sdk_root="$RUNNER_TEMP/vulkan-sdk"
          installer_root="$RUNNER_TEMP/vulkan-installer"
          curl --fail --location --retry 3 "https://sdk.lunarg.com/sdk/download/$sdk_version/mac/vulkansdk-macos-$sdk_version.zip" -o "$RUNNER_TEMP/vulkan-sdk.zip"
          unzip -q "$RUNNER_TEMP/vulkan-sdk.zip" -d "$installer_root"
          sudo "$installer_root/vulkansdk-macOS-$sdk_version.app/Contents/MacOS/vulkansdk-macOS-$sdk_version" --root "$sdk_root" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          test -d "$sdk_root/macOS"
          echo "VULKAN_SDK=$sdk_root/macOS" >> "$GITHUB_ENV"
      - run: npm run native:build
      - run: cargo test --locked --manifest-path native/pcb-board-packer/Cargo.toml
      - run: cargo test --locked --manifest-path native/analyze/Cargo.toml
      - name: Check native runtime dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            dependencies=$(ldd native/node-addon/*.node)
          elif [[ "$RUNNER_OS" == macOS ]]; then
            dependencies=$(otool -L native/node-addon/*.node)
          else
            exit 0
          fi
          printf '%s\n' "$dependencies"
          if grep -Ei 'lib(cuda|nvrtc|vulkan|MoltenVK)|not found' <<< "$dependencies"; then
            echo 'Native addon must load without GPU libraries installed.' >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: native-${{ matrix.os }}
          path: native/node-addon/*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
