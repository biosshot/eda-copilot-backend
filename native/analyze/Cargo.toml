[package]
name = "pcb-analyze"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
geo = { version = "=0.31.0", default-features = false }
i_overlay = { version = "=4.0.7", default-features = false }
rstar = "=0.12.2"
spade = { version = "=2.15.1", default-features = false, features = ["std"] }
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg", "rayon"] }
rustfft = { version = "=6.4.1", default-features = false }
rayon = "=1.11.0"
sha2 = "=0.10.9"
