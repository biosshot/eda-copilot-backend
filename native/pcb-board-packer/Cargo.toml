[package]
name = "pcb-board-packer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9", "serde-json"] }
napi-derive = "3"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = "1.15"
cubecl = { version = "=0.10.0", optional = true, default-features = false, features = ["std", "wgpu-spirv"] }
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["vulkan"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
# GPU runtime panics must be caught before the N-API boundary for CPU restart.
panic = "unwind"
strip = "symbols"

[features]
default = ["gpu"]
gpu = ["dep:cubecl", "dep:wgpu"]
placement-bench = []
