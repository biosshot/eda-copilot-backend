[package]
name = "pcb-board-packer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9", "serde-json"] }
napi-derive = "3"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = "1.15"
cubecl = { version = "=0.10.0", optional = true, default-features = false, features = ["std", "cuda"] }
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["vulkan"] }
# Existing locked transitive crates; exposes hooks without adding a new runtime.
cubecl-runtime = { version = "=0.10.0", optional = true, default-features = false }
ash = { version = "=0.38.0", optional = true, default-features = false }

# Vulkan kernels are SPIR-V. cubecl-wgpu's build script requires VULKAN_SDK on
# macOS whenever its `spirv` feature is on, so macOS builds only MSL for Metal.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cubecl = { version = "=0.10.0", optional = true, default-features = false, features = ["wgpu-spirv"] }

# Metal kernels are MSL; the memory budget comes from MTLDevice (objc2 crates
# are already locked through wgpu-hal).
[target.'cfg(target_os = "macos")'.dependencies]
cubecl = { version = "=0.10.0", optional = true, default-features = false, features = ["wgpu-msl"] }
objc2 = { version = "=0.6.4", optional = true }
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "MTLDevice"] }

[dependencies.cudarc]
version = "=0.19.10"
optional = true
default-features = false
features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
# GPU runtime panics must be caught before the N-API boundary for CPU restart.
panic = "unwind"
strip = "symbols"

[features]
default = ["gpu"]
gpu = ["dep:cubecl", "dep:wgpu", "dep:cubecl-runtime", "dep:ash", "dep:cudarc", "dep:objc2", "dep:objc2-metal"]
placement-bench = []

[patch.crates-io]
cubecl-cuda = { path = "vendor/cubecl-cuda" }
